[project]
name = "agent-trace-review"
version = "0.1.0"
description = "AIエージェントの行動記録から承認漏れや暴走を見つける"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
agent-trace-review = "trace_review.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["trace_review"]

[tool.ruff]
line-length = 160
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S108"]
